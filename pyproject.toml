[project]
name = "harness"
version = "0.1.0"
description = "Harness engineering workshop"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "python-dotenv>=1.2.4",
]

[project.scripts]
harness = "harness:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = ""
